name: Build & Release APK

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests & build APK
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: Prepare APK artifact
        run: |
          mkdir -p dist
          VERSION="${GITHUB_REF_NAME}"
          if [[ "${GITHUB_REF_TYPE}" != "tag" ]]; then
            VERSION="dev-${GITHUB_SHA::7}"
          fi
          APK_NAME="Dice10K-${VERSION}.apk"
          cp app/build/outputs/apk/debug/app-debug.apk "dist/${APK_NAME}"
          (cd dist && sha256sum "${APK_NAME}" > "${APK_NAME}.sha256")
          echo "APK_NAME=${APK_NAME}" >> "$GITHUB_ENV"

      - name: Upload APK build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Dice10K-APK
          path: dist/*

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "Dice10K ${{ github.ref_name }}"
          generate_release_notes: true
          body: |
            ## 🎲 Dice10K `${{ github.ref_name }}`

            Téléchargez et installez **`${{ env.APK_NAME }}`** directement sur votre appareil Android (Android 6.0+).

            - **100 % hors ligne, sans publicité et sans aucune permission système.**
            - **Empreinte SHA-256** disponible dans `${{ env.APK_NAME }}.sha256`.

            > 💖 Ce projet est libre et gratuit. Vous pouvez soutenir son développement via [GitHub Sponsors](https://github.com/sponsors/furcy75) ou [Ko-fi](https://ko-fi.com/furcy75).
          files: |
            dist/*.apk
            dist/*.sha256
